name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: project2-production:ci

      - name: Run container smoke test
        run: |
          docker run --rm -d \
            --name project2-api-ci \
            -p 8000:8000 \
            project2-production:ci

          sleep 5

          docker ps -a

          docker logs project2-api-ci || true

          curl --fail --retry 10 --retry-delay 2 \
            http://127.0.0.1:8000/health