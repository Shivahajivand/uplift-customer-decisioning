name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Run pytest
        run: pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: project2-production:ci

      - name: Run container smoke test
        run: |
          docker run --rm -d \
            --name project2-api-ci \
            -p 8000:8000 \
            project2-production:ci

          sleep 5

          docker ps -a

          docker logs project2-api-ci || true

          curl --fail --retry 10 --retry-delay 2 \
            http://127.0.0.1:8000/health

          curl --fail --retry 10 --retry-delay 2 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"f0":0.0,"f1":0.0,"f2":0.0,"f3":0.0,"f4":0.0,"f5":0.0,"f6":0.0,"f7":0.0,"f8":0.0,"f9":0.0,"f10":0.0,"f11":0.0}' \
            http://127.0.0.1:8000/predict

          curl --fail --retry 10 --retry-delay 2 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"f0":0.0,"f1":0.0,"f2":0.0,"f3":0.0,"f4":0.0,"f5":0.0,"f6":0.0,"f7":0.0,"f8":0.0,"f9":0.0,"f10":0.0,"f11":0.0,"threshold":0.01}' \
            http://127.0.0.1:8000/decision