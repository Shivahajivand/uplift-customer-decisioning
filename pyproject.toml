[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project2-production-core"
version = "8.0.4"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.53,<0.54",
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
    "httpx2>=2.13,<2.14",
    "anyio>=4.10,<4.15",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]